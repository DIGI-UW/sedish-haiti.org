server {
    listen          80;
    server_name     shr.*;

    location /.well-known/acme-challenge/ {
        resolver    127.0.0.11 valid=30s;
        set         $upstream_certbot certbot;
        proxy_pass  http://$upstream_certbot$request_uri;
    }

    location / {
        return      301 https://$host$request_uri;
    }
}

server {
    listen          443 ssl;
    listen          [::]:443 ssl;
    server_name     shr.*;

    location /.well-known/acme-challenge/ {
        resolver    127.0.0.11 valid=30s;
        set         $upstream_certbot certbot;
        proxy_pass  http://$upstream_certbot$request_uri;
    }

    # Proxy to HAPI FHIR datastore server (used by SHR as backend)
    location / {
        resolver    127.0.0.11 valid=30s;
        set         $upstream_hapi_fhir hapi-fhir;
        proxy_pass  http://$upstream_hapi_fhir:8080;
    }
}
