version: '3.8'

services:
  hapi-fhir:
    ports:
      - target: 8080
        published: 3447
        mode: host
    environment:
      - hapi.fhir.server_address=https://${SUBDOMAIN_DEV_SHR}.${DOMAIN_NAME}/fhir
      - hapi.fhir.tester.home.server_address=https://${SUBDOMAIN_DEV_SHR}.${DOMAIN_NAME}/fhir