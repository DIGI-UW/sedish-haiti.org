name: lnsp-mediator CI

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/lnsp-mediator/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'projects/lnsp-mediator/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/lnsp-mediator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: projects/lnsp-mediator/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test --runInBand


